<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>StreamBox & Me</title>
<meta name="theme-color" content="#0f172a" />
<meta name="robots" content="noindex" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="lock-screen">
  <div class="lock-card">
    <h2 id="gate-title">Rejoindre l'appel</h2>
    <p>Entre le mot de passe du live pour continuer</p>
    <form id="gate-form">
      <input id="gate-input" class="lock-input lock-input--password" type="text" inputmode="numeric" autocomplete="off" />
      <button type="submit" class="copy-btn" style="margin-top: 14px;">Valider</button>
    </form>
    <p id="gate-error" class="lock-error"></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var LIVE_PASSWORD = "__LIVE_PASSWORD__";
  var VMIX_URL = "__VMIX_URL__";
  var LIVE_URL = "__LIVE_URL__";

  // Cette page sert de portail pour deux destinations : l'appel vMix (par
  // défaut) et le Live Vimeo (?to=live). Même mot de passe, même logique,
  // on évite de dupliquer le portail dans un second fichier.
  var isLive = new URLSearchParams(window.location.search).get("to") === "live";
  var target = isLive ? LIVE_URL : VMIX_URL;
  if (isLive) {
    document.getElementById("gate-title").textContent = "Accéder au Live";
  }

  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-input");
  var error = document.getElementById("gate-error");

  function vibrate(ms) {
    if (navigator.vibrate) {
      navigator.vibrate(ms);
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    error.textContent = "";
    if (input.value === LIVE_PASSWORD) {
      window.location.replace(target);
    } else {
      error.textContent = "Mot de passe incorrect";
      vibrate(20);
      input.value = "";
      input.focus();
    }
  });

  setTimeout(function () {
    input.focus();
  }, 50);
})();
</script>
</body>
</html>
