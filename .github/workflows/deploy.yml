name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into a deployable copy
        env:
          VMIX_URL: ${{ secrets.VMIX_URL }}
          VMIX_PASSWORD: ${{ secrets.VMIX_PASSWORD }}
          LIVE_URL: ${{ secrets.LIVE_URL }}
          LIVE_PASSWORD: ${{ secrets.LIVE_PASSWORD }}
          CHAT_URL: ${{ secrets.CHAT_URL }}
          HELP_PHONE: ${{ secrets.HELP_PHONE }}
          ACCESS_PIN: ${{ secrets.ACCESS_PIN }}
        run: |
          set -eu
          rm -rf dist
          mkdir dist
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'dist' ./ dist/

          replace() {
            local token="$1" value="$2" file="$3" escaped
            escaped=$(printf '%s' "$value" | sed -e 's/[\&|]/\\&/g')
            sed -i "s|$token|$escaped|g" "$file"
          }

          replace "__VMIX_URL__" "$VMIX_URL" dist/index.html
          replace "__VMIX_PASSWORD__" "$VMIX_PASSWORD" dist/index.html
          replace "__LIVE_URL__" "$LIVE_URL" dist/index.html
          replace "__LIVE_PASSWORD__" "$LIVE_PASSWORD" dist/index.html
          replace "__CHAT_URL__" "$CHAT_URL" dist/index.html
          replace "__HELP_PHONE__" "$HELP_PHONE" dist/index.html
          replace "__ACCESS_PIN__" "$ACCESS_PIN" dist/app.js
          replace "__ACCESS_PIN__" "$ACCESS_PIN" dist/invite.html
          replace "__VMIX_URL__" "$VMIX_URL" dist/invite.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
